plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mantel.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mantel.tv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the standard debug key so it installs by sideloading.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
