name: Build launcher APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Publish as the "latest" release (easy to download from Termux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk launcher.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest launcher.apk \
            --title "Latest build" \
            --notes "Built from commit ${{ github.sha }}"
