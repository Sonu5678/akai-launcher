name: Build Mantel APK

# Runs by itself whenever you push, and you can also start it by hand from the Actions tab
# (Run workflow). Two independent builds run side by side; use whichever finishes with a
# green tick. Each one uploads Mantel.apk as a downloadable "artifact" at the bottom of its run.

on:
  push:
  workflow_dispatch:

jobs:
  build-script:
    name: Build with the SDK tools (no Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null || true
          bash tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mantel-apk-script
          path: build/Mantel.apk
          if-no-files-found: error

  build-gradle:
    name: Build with Gradle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Mantel-apk-gradle
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
