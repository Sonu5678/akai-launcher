name: Build Mantel APK

# Runs on every push, and can be started by hand from the Actions tab (Run workflow).
# GitHub's Ubuntu runners already include the Android SDK, so nothing is installed here.
# The SDK-tools build is the main one. The Gradle build is a spare: if it fails, the
# run still counts as a success as long as the SDK-tools build worked.

on:
  push:
  workflow_dispatch:

jobs:
  build-script:
    name: Build with the SDK tools (no Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: bash tools/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mantel-apk-script
          path: build/Mantel.apk
          if-no-files-found: error

  build-gradle:
    name: Build with Gradle
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Mantel-apk-gradle
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
